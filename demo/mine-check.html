<!DOCTYPE html><html><head><meta charset="utf-8">
<title>mine-check</title><style>/* 盛唐敦煌壁画美学 · Design Token
   低饱和、沉静华贵：象牙白/月白/浅石青/淡青绿/浅赭，暗金与低饱和朱砂少量点缀 */
body {
  /* 主色 */
  --ivory: #f4ecdd;          /* 象牙白 · 底 */
  --ivory-deep: #ece1cd;
  --moon: #e6ebea;           /* 月白 · 冷高光 */
  --azurite: #8fa6ab;        /* 浅石青 */
  --azurite-deep: #6f8b92;
  --celadon: #a6bfae;        /* 淡青绿 */
  --celadon-deep: #86a590;
  --ochre: #c7a987;          /* 浅赭 */
  --ochre-deep: #b08d68;

  /* 点缀 */
  --dark-gold: #a8893a;      /* 暗金 · 少量 */
  --dark-gold-soft: #c2a668;
  --cinnabar: #9e4a2a;       /* 低饱和朱砂 · 局部重心 */
  --cinnabar-soft: #b06a4a;

  /* 墨色文字 */
  --ink: #463e36;
  --ink-soft: #6a5f52;
  --ink-muted: #93867a;

  /* 语义 */
  --bg: #f4ecdd;
  --bg-card: #fbf6ec;
  --bg-card-deep: #f1e8d6;
  --line: #e0d4bf;

  /* 字号 */
  --fs-title: 22px;
  --fs-h2: 17px;
  --fs-body: 14px;
  --fs-small: 12px;
  --fs-mini: 10px;

  /* 圆角与间距 */
  --radius-lg: 12px;
  --radius: 8px;
  --radius-sm: 5px;
  --space: 12px;

  /* 阴影 · 克制 */
  --shadow: 0 4px 15px rgba(90, 74, 50, 0.08);
  --shadow-deep: 0 6px 20px rgba(90, 74, 50, 0.14);

  background-color: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Songti SC", "Noto Serif SC", serif;
}

/* 通用样式类 */
.page-wrap {
  min-height: 100vh;
  box-sizing: border-box;
  padding: 12px 14px calc(20px + 0px);
}

.card {
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}

.title-lg {
  font-size: var(--fs-title);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 1px;
}

.title-h2 {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--ink);
}

.text-body { font-size: var(--fs-body); color: var(--ink-soft); line-height: 1.7; }
.text-muted { font-size: var(--fs-small); color: var(--ink-muted); line-height: 1.6; }

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  border-radius: 499.5px;
  background: linear-gradient(135deg, var(--cinnabar) 0%, var(--ochre-deep) 100%);
  color: #fbf3e4;
  font-size: 15px;
  letter-spacing: 2px;
  border: none;
}
.btn-primary::after { border: none; }

.btn-ghost {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 42px;
  border-radius: 499.5px;
  background: rgba(255, 255, 255, 0.5);
  color: var(--ink-soft);
  font-size: 14px;
  border: 0.5px solid var(--line);
}
.btn-ghost::after { border: none; }

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 499.5px;
  font-size: var(--fs-mini);
  background: var(--bg-card-deep);
  color: var(--ink-soft);
  margin-right: 6px;
}
.tag-gold { background: rgba(168, 137, 58, 0.12); color: var(--dark-gold); }
.tag-cinnabar { background: rgba(158, 74, 42, 0.1); color: var(--cinnabar); }

.row-between { display: flex; align-items: center; justify-content: space-between; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-sm { gap: 6px; }

/* —— 全局打磨（Line5）：轻按反馈与平滑过渡 —— */
.card, .mode-card, .grid-item, .stat {
  transition: box-shadow 0.25s ease, transform 0.15s ease;
}
.card:active, .mode-card:active, .grid-item:active { transform: scale(0.985); }
.btn-primary, .btn-ghost, .bar-cart, .bar-buy { transition: opacity 0.2s ease, transform 0.15s ease; }
.btn-primary:active, .bar-buy:active { transform: scale(0.98); opacity: 0.92; }
image { transition: opacity 0.3s ease; }


.mine {
  min-height: 100vh;
  background: var(--bg);
}

/* —— 头部 —— */
.mine-head {
  position: relative;
  padding: 36px 0 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background:
    radial-gradient(120% 100% at 50% 0%, var(--moon), transparent 70%),
    linear-gradient(180deg, var(--ivory-deep), var(--bg));
  overflow: hidden;
}
.mine-head::before {
  content: '';
  position: absolute;
  top: 18px;
  width: 115px;
  height: 115px;
  border-radius: 50%;
  border: 0.5px solid var(--dark-gold-soft);
  opacity: 0.4;
}
.avatar {
  position: relative;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  overflow: hidden;
  border: 1.5px solid var(--dark-gold-soft);
  box-shadow: var(--shadow-deep);
  margin-bottom: 10px;
}
.avatar-img { width: 100%; height: 100%; }
.mine-name {
  font-size: var(--fs-title);
  color: var(--ink);
  font-weight: 600;
  letter-spacing: 2px;
}
.mine-sub {
  font-size: var(--fs-small);
  color: var(--ink-muted);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.mine-body { padding-top: 3px; }

/* —— 克制的入场动效（仅一次，不循环） —— */
@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
.rise { animation: rise 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

/* —— 统计 —— */
.stat-grid { display: flex; gap: 10px; margin-bottom: 12px; }
.stat {
  flex: 1;
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 14px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stat-num { font-size: 22px; color: var(--dark-gold); font-weight: 600; }
.stat-label { font-size: var(--fs-small); color: var(--ink-muted); margin-top: 3px; }

/* —— 卡片统一头 —— */
.card-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 12px;
}
.card-head-titles { display: flex; flex-direction: column; }
.card-sub {
  font-size: var(--fs-mini);
  color: var(--ink-muted);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* —— 龙鳞集章墙 —— */
.scale-card { padding: 15px 12px; }
.scale-progress {
  font-size: var(--fs-h2);
  color: var(--dark-gold);
  font-weight: 600;
}
.scale-wall { display: flex; flex-wrap: wrap; }
.scale-cell {
  width: 25%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 0 8px;
}
.scale-medal {
  width: 46px;
  height: 48px;
  /* 鳞/水滴形 */
  border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card-deep);
  border: 0.5px solid var(--line);
  transition: transform 0.2s ease;
}
.scale-medal.got {
  background: linear-gradient(155deg, var(--dark-gold-soft) 0%, var(--dark-gold) 80%);
  border: 0.5px solid var(--dark-gold);
  box-shadow: var(--shadow-deep);
}
.scale-core {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--line);
}
.scale-medal.got .scale-core {
  background: var(--bg-card);
}
.scale-name {
  font-size: var(--fs-small);
  color: var(--ink-muted);
  margin-top: 6px;
  letter-spacing: 0.5px;
}
.scale-name.on { color: var(--ink); font-weight: 600; }
.scale-hall {
  font-size: var(--fs-mini);
  color: var(--ink-muted);
  margin-top: 2px;
}

/* —— 景点巡游卡片 —— */
.spot-card { padding: 15px 12px; }
.spot-list { display: flex; flex-direction: column; }
.spot-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 8px;
  background: var(--bg-card-deep);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  transition: transform 0.15s ease, box-shadow 0.25s ease;
}
.spot-row:last-child { margin-bottom: 0; }
.spot-row:active { transform: scale(0.99); }
.spot-row.soon { opacity: 0.72; }
.spot-emblem {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  flex-shrink: 0;
  background: var(--ivory-deep);
  display: flex;
  align-items: center;
  justify-content: center;
}
.spot-emblem.on { box-shadow: var(--shadow); }
.spot-emblem-img { width: 100%; height: 100%; }
.spot-emblem-text { font-size: var(--fs-small); color: var(--ink-muted); }
.spot-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.spot-name { font-size: var(--fs-body); color: var(--ink); font-weight: 600; }
.spot-sub { font-size: var(--fs-mini); color: var(--ink-muted); margin-top: 3px; }
.spot-meta { margin-top: 5px; display: flex; }
.spot-tag {
  font-size: var(--fs-mini);
  color: var(--ink-muted);
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: 499.5px;
  padding: 1.5px 7px;
}
.spot-tag.visited {
  color: var(--dark-gold);
  border-color: var(--dark-gold-soft);
  background: var(--ivory);
}
.spot-badge {
  font-size: var(--fs-mini);
  border-radius: 499.5px;
  padding: 3px 9px;
  flex-shrink: 0;
}
.spot-badge.on { color: var(--dark-gold); border: 0.5px solid var(--dark-gold-soft); }
.spot-badge.soon { color: var(--ink-muted); background: var(--bg-card); }

/* —— 我的入口 —— */
.menu-card { padding: 15px 12px; }
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--line);
}
.menu-item:last-child { border-bottom: none; }
/* 意向单重点入口 */
.menu-item.hot {
  padding: 10px;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--cinnabar-soft) 0%, var(--ochre-deep) 100%);
  border: none;
  border-radius: var(--radius);
}
.hot-left { display: flex; align-items: center; gap: 9px; }
.hot-icon {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--cinnabar);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
}
.hot-info { display: flex; flex-direction: column; }
.hot-label { color: var(--bg-card); font-weight: 600; }
.hot-sub {
  font-size: var(--fs-mini);
  color: var(--ivory-deep);
  margin-top: 2px;
}
.m-label { font-size: var(--fs-body); color: var(--ink-soft); }
.m-arrow { font-size: 18px; color: var(--ink-muted); }
.menu-item.hot .m-arrow { color: var(--bg-card); }

.reset-btn { margin-top: 6px; }

</style></head>
