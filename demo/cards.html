<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:720px;height:1280px;font-family:"Noto Serif CJK SC",serif;overflow:hidden;}
.card{position:absolute;inset:0;display:none;flex-direction:column;
  background:
   radial-gradient(120% 50% at 12% 6%,rgba(166,191,174,.35),transparent 60%),
   radial-gradient(120% 55% at 88% 10%,rgba(143,166,171,.3),transparent 55%),
   linear-gradient(180deg,#ece1cd,#f4ecdd 48%,#f6efe2);
  padding:110px 70px;}
.card.on{display:flex;}
.frame{position:absolute;inset:34px;border:2px solid #c7a962;border-radius:26px;pointer-events:none;}
.frame::before{content:"";position:absolute;inset:10px;border:1px solid rgba(168,137,58,.5);border-radius:18px;}
.kicker{text-align:center;color:#9e4a2a;font-size:26px;letter-spacing:14px;font-weight:700;}
.title{text-align:center;color:#463e36;font-size:96px;font-weight:900;letter-spacing:18px;margin-top:34px;
  text-shadow:0 4px 0 rgba(168,137,58,.25);}
.subtitle{text-align:center;color:#a8893a;font-size:32px;letter-spacing:8px;margin-top:26px;}
.divider{display:flex;align-items:center;gap:18px;margin:64px 0 48px;color:#a8893a;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#b89a5a,transparent);}
.divider span{font-size:30px;letter-spacing:6px;}
.flow{display:flex;flex-direction:column;gap:30px;}
.flow-item{display:flex;align-items:center;gap:28px;background:rgba(251,246,236,.85);border:1px solid #e0d2b2;border-radius:20px;padding:32px 36px;box-shadow:0 10px 26px rgba(70,62,54,.1);}
.flow-item .no{width:78px;height:78px;flex-shrink:0;border-radius:50%;background:linear-gradient(180deg,#b0563a,#92401f);color:#fbe6cf;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;box-shadow:0 8px 18px rgba(158,74,42,.35);}
.flow-item .ft{font-size:38px;color:#463e36;font-weight:800;}
.flow-item .fd{font-size:24px;color:#8a7d6a;margin-top:8px;letter-spacing:1px;}
.foot{margin-top:auto;text-align:center;color:#9e4a2a;font-size:30px;letter-spacing:6px;font-weight:700;}
.foot small{display:block;color:#a8893a;font-size:22px;margin-top:14px;letter-spacing:3px;font-weight:400;}

/* outro */
#outro{align-items:center;text-align:center;}
.big{font-size:74px;color:#463e36;font-weight:900;letter-spacing:14px;margin-top:150px;line-height:1.5;}
.big .g{color:#9e4a2a;}
.olines{margin-top:80px;display:flex;flex-direction:column;gap:26px;color:#6a5f52;font-size:30px;letter-spacing:3px;}
.chips{margin-top:70px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
.chips span{font-size:24px;color:#a8893a;border:1px solid #c7a962;border-radius:999px;padding:10px 26px;background:rgba(251,246,236,.7);}
.oteam{margin-top:auto;color:#463e36;font-size:34px;font-weight:800;letter-spacing:8px;}
.oteam small{display:block;color:#a8893a;font-size:23px;margin-top:16px;letter-spacing:2px;font-weight:400;}
</style>
</head>
<body>
  <div class="card on" id="guide">
    <div class="frame"></div>
    <div class="kicker">演 示 导 览</div>
    <div class="title">长安云阙</div>
    <div class="subtitle">AR 文旅助手 · 大明宫</div>
    <div class="divider"><span>三 条 主 链 路</span></div>
    <div class="flow">
      <div class="flow-item"><div class="no">壹</div><div><div class="ft">云游集鳞</div><div class="fd">不到现场，走完七剧场 · 集齐七片龙鳞</div></div></div>
      <div class="flow-item"><div class="no">贰</div><div><div class="ft">现场 AR 复原</div><div class="fd">marker＋VKSession，遗址上重现殿宇</div></div></div>
      <div class="flow-item"><div class="no">叁</div><div><div class="ft">商城意向闭环</div><div class="fd">AR 预览 · 加购 · 预售登记 · 意向单</div></div></div>
    </div>
    <div class="foot">跟着云阙，把「长安」带回家<small>默认离线演示 · useMock = true</small></div>
  </div>

  <div class="card" id="outro">
    <div class="frame"></div>
    <div class="big">愿长安<span class="g">灯火不熄</span><br/>山河无恙</div>
    <div class="olines">
      <div>景点数字馆 ＋ 云阙 AR 巡游 ＋ 云阙商城</div>
      <div>原生 TypeScript · XRFrame · 微信云开发</div>
    </div>
    <div class="chips">
      <span>大明宫（已上线）</span><span>大雁塔（即将上线）</span><span>模板可复用</span>
    </div>
    <div class="oteam">飞行社 · 长安云阙团队<small>盛唐文物活化 AR 文旅助手 · 2026</small></div>
  </div>
</body>
</html>
