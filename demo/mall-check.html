<!DOCTYPE html><html><head><meta charset="utf-8">
<title>mall-check</title><style>/* 盛唐敦煌壁画美学 · Design Token
   低饱和、沉静华贵：象牙白/月白/浅石青/淡青绿/浅赭，暗金与低饱和朱砂少量点缀 */
body {
  /* 主色 */
  --ivory: #f4ecdd;          /* 象牙白 · 底 */
  --ivory-deep: #ece1cd;
  --moon: #e6ebea;           /* 月白 · 冷高光 */
  --azurite: #8fa6ab;        /* 浅石青 */
  --azurite-deep: #6f8b92;
  --celadon: #a6bfae;        /* 淡青绿 */
  --celadon-deep: #86a590;
  --ochre: #c7a987;          /* 浅赭 */
  --ochre-deep: #b08d68;

  /* 点缀 */
  --dark-gold: #a8893a;      /* 暗金 · 少量 */
  --dark-gold-soft: #c2a668;
  --cinnabar: #9e4a2a;       /* 低饱和朱砂 · 局部重心 */
  --cinnabar-soft: #b06a4a;

  /* 墨色文字 */
  --ink: #463e36;
  --ink-soft: #6a5f52;
  --ink-muted: #93867a;

  /* 语义 */
  --bg: #f4ecdd;
  --bg-card: #fbf6ec;
  --bg-card-deep: #f1e8d6;
  --line: #e0d4bf;

  /* 字号 */
  --fs-title: 22px;
  --fs-h2: 17px;
  --fs-body: 14px;
  --fs-small: 12px;
  --fs-mini: 10px;

  /* 圆角与间距 */
  --radius-lg: 12px;
  --radius: 8px;
  --radius-sm: 5px;
  --space: 12px;

  /* 阴影 · 克制 */
  --shadow: 0 4px 15px rgba(90, 74, 50, 0.08);
  --shadow-deep: 0 6px 20px rgba(90, 74, 50, 0.14);

  background-color: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Songti SC", "Noto Serif SC", serif;
}

/* 通用样式类 */
.page-wrap {
  min-height: 100vh;
  box-sizing: border-box;
  padding: 12px 14px calc(20px + 0px);
}

.card {
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}

.title-lg {
  font-size: var(--fs-title);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 1px;
}

.title-h2 {
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--ink);
}

.text-body { font-size: var(--fs-body); color: var(--ink-soft); line-height: 1.7; }
.text-muted { font-size: var(--fs-small); color: var(--ink-muted); line-height: 1.6; }

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  border-radius: 499.5px;
  background: linear-gradient(135deg, var(--cinnabar) 0%, var(--ochre-deep) 100%);
  color: #fbf3e4;
  font-size: 15px;
  letter-spacing: 2px;
  border: none;
}
.btn-primary::after { border: none; }

.btn-ghost {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 42px;
  border-radius: 499.5px;
  background: rgba(255, 255, 255, 0.5);
  color: var(--ink-soft);
  font-size: 14px;
  border: 0.5px solid var(--line);
}
.btn-ghost::after { border: none; }

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 499.5px;
  font-size: var(--fs-mini);
  background: var(--bg-card-deep);
  color: var(--ink-soft);
  margin-right: 6px;
}
.tag-gold { background: rgba(168, 137, 58, 0.12); color: var(--dark-gold); }
.tag-cinnabar { background: rgba(158, 74, 42, 0.1); color: var(--cinnabar); }

.row-between { display: flex; align-items: center; justify-content: space-between; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-sm { gap: 6px; }

/* —— 全局打磨（Line5）：轻按反馈与平滑过渡 —— */
.card, .mode-card, .grid-item, .stat {
  transition: box-shadow 0.25s ease, transform 0.15s ease;
}
.card:active, .mode-card:active, .grid-item:active { transform: scale(0.985); }
.btn-primary, .btn-ghost, .bar-cart, .bar-buy { transition: opacity 0.2s ease, transform 0.15s ease; }
.btn-primary:active, .bar-buy:active { transform: scale(0.98); opacity: 0.92; }
image { transition: opacity 0.3s ease; }


/* —— 商城列表页打磨：盛唐敦煌低饱和质感，克制留白与层级 —— */
.mall { padding-top: 4px; }

.mall-head { margin: 3px 2px 12px; }
.mall-title {
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 1.5px;
  display: block;
}
.mall-sub {
  font-size: var(--fs-small);
  color: var(--ink-muted);
  margin-top: 4px;
  display: block;
  letter-spacing: 0.5px;
}

/* 分类筛选：选中=深墨 pill，未选=卡纸描边 pill */
.cat-bar { white-space: nowrap; margin-bottom: 14px; }
.cat {
  display: inline-flex;
  align-items: center;
  padding: 6.5px 16px;
  margin-right: 8px;
  font-size: var(--fs-small);
  color: var(--ink-soft);
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: 499.5px;
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
}
.cat.on {
  background: var(--ink);
  color: var(--ivory);
  border-color: var(--ink);
  font-weight: 600;
}

/* 商品双列卡 */
.goods-grid { display: flex; flex-wrap: wrap; gap: 11px; }
.grid-item {
  width: calc(50% - 5.5px);
  background: var(--bg-card);
  border: 0.5px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: mallFadeUp 0.5s ease backwards;
}
.grid-cover {
  position: relative;
  height: 150px;
  background: linear-gradient(160deg, var(--ivory-deep), var(--bg-card-deep));
  overflow: hidden;
}
.grid-cover-img { width: 100%; height: 100%; }
.grid-cover-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cover-cat { font-size: var(--fs-small); color: var(--dark-gold); letter-spacing: 1.5px; }
.cover-scrim {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 45px;
  background: linear-gradient(180deg, transparent, rgba(70, 62, 54, 0.18));
  pointer-events: none;
}
.cover-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 2.5px 8px;
  font-size: var(--fs-mini);
  color: var(--ivory);
  background: rgba(158, 74, 42, 0.88);
  border-radius: 499.5px;
  letter-spacing: 0.5px;
}

.grid-info { padding: 9px 10px 11px; }
.grid-name {
  font-size: var(--fs-small);
  color: var(--ink);
  font-weight: 600;
  line-height: 1.45;
  height: 33px;
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.grid-desc {
  font-size: var(--fs-mini);
  color: var(--ink-muted);
  line-height: 1.5;
  margin-top: 3px;
  height: 15px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  display: block;
}
.grid-foot {
  margin-top: 7px;
  display: flex;
  align-items: baseline;
}
.grid-price { font-size: 17px; color: var(--cinnabar); font-weight: 700; }
.grid-price-symbol { font-size: var(--fs-small); font-weight: 600; margin-right: 1px; }

@keyframes mallFadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}


body{margin:0;background:#f4ecdd;}
.page-wrap{width:375px;margin:0 auto;}

span{display:block;}
.grid-price-symbol,.scale-num-sep{display:inline;}
button{font-family:inherit;}
</style></head>

      <div class="grid-foot"><span class="grid-price"><span class="grid-price-symbol">¥</span>79</span></div></div></div><div class="grid-item" style="animation-delay:300ms">
    <div class="grid-cover"><img class="grid-cover-img" src="../miniprogram/assets/goods/g-shihe.jpg">

    <div class="grid-info"><span class="grid-name">长安食盒·城市限定美食礼盒</span><span class="grid-desc">萌龙绿豆糕龙鳞酥柿子饼</span>
      <div class="grid-foot"><span class="grid-price"><span class="grid-price-symbol">¥</span>199</span></div></div></div></div></div></body></html>
